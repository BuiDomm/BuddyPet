[package]
name = "buddypet"
version = "0.1.0"
description = "A playful, privacy-first desktop companion"
authors = ["BuddyPet contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "buddypet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
chrono = { version = "0.4.42", features = ["serde", "clock"] }
rand = "0.9.2"
schemars = { version = "1.1.0", features = ["chrono04"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.3.6"
tauri-plugin-store = "2.4.1"
tauri-plugin-updater = "2.10.0"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
xcap = { version = "0.9.7", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
core-foundation-sys = "0.8.7"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSWindow", "NSApplication", "NSScreen"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[dev-dependencies]
proptest = "1.9.0"
tempfile = "3.23.0"
